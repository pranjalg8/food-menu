<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Image Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .selected { border: 4px solid #10B981; transform: scale(1.02); }
        .img-card:hover { transform: scale(1.02); }
        body { padding-bottom: 200px; } /* Space for fixed footer */
    </style>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-4 text-center text-amber-500">Dish Image Review (Local Mode)</h1>
        <p class="text-center text-gray-500 mb-6">Images are loaded from your local disk for maximum speed.</p>
        
        <!-- Progress Bar -->
        <div class="mb-8 bg-gray-800 p-4 rounded-xl">
            <div class="flex justify-between text-sm text-gray-400 mb-2">
                <span id="batch-indicator" class="font-bold text-white">Batch 1</span>
                <span id="progress-percent">0% Completed</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2.5">
                <div id="progress-bar" class="bg-amber-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div id="grid" class="min-h-[50vh]"></div>
    </div>

    <!-- Navigation Footer -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-800 p-6 border-t border-gray-700 shadow-2xl z-50">
        <div class="max-w-7xl mx-auto flex flex-col gap-4">
            
            <div class="flex justify-between items-center">
                <button onclick="prevBatch()" id="prev-btn" class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-bold disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    ← Previous
                </button>
                
                <div class="text-center">
                     <span id="status" class="text-green-400 font-bold block text-lg">0 images selected</span>
                     <span class="text-xs text-gray-500">Selection auto-saved locally</span>
                </div>

                <button onclick="nextBatch()" id="next-btn" class="bg-amber-500 hover:bg-amber-400 text-black px-8 py-3 rounded-lg font-bold transition-colors shadow-lg shadow-amber-900/20">
                    Next Batch →
                </button>
                
                <button onclick="exportSelection()" id="export-btn" class="hidden bg-green-500 hover:bg-green-400 text-black px-8 py-3 rounded-lg font-bold transition-colors shadow-lg shadow-green-900/20">
                    ✅ Finish & Export JSON
                </button>
            </div>

            <div id="export-area" class="hidden">
                 <p class="text-sm text-gray-400 mb-2">Copy this JSON and send it to me:</p>
                 <textarea id="output" class="w-full h-32 bg-gray-900 text-green-400 font-mono text-xs p-4 rounded border border-gray-700 focus:border-green-500 outline-none" readonly></textarea>
            </div>
        </div>
    </div>

        // Initialize selection from localStorage if available, else empty
        const savedSelection = localStorage.getItem('menu_image_selection');
        const selection = savedSelection ? JSON.parse(savedSelection) : {};
        
        const dishes = Object.keys(candidates).sort();
        const BATCH_SIZE = 4;
        let currentBatch = 0;
        const totalBatches = Math.ceil(dishes.length / BATCH_SIZE);

        // Core Functions
        function renderBatch(batchIndex) {
            const grid = document.getElementById('grid');
            grid.innerHTML = ''; 

            const start = batchIndex * BATCH_SIZE;
            const end = Math.min(start + BATCH_SIZE, dishes.length);
            const batchDishes = dishes.slice(start, end);

            batchDishes.forEach(dish => {
                const urls = candidates[dish];
                if (!urls || urls.length === 0) return;

                const section = document.createElement('div');
                section.className = 'bg-gray-800 p-6 rounded-xl mb-8 border border-gray-700';
                
                const header = document.createElement('div');
                header.className = 'flex justify-between items-center mb-4';
                
                const title = document.createElement('h3');
                title.className = 'text-xl font-bold text-white';
                title.textContent = dish;
                
                const count = document.createElement('span');
                count.className = 'text-xs bg-gray-700 px-2 py-1 rounded text-gray-400';
                count.textContent = `${urls.length} options`;

                header.append(title, count);
                section.appendChild(header);

                const imgRow = document.createElement('div');
                imgRow.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4';

                urls.forEach(url => {
                    const wrap = document.createElement('div');
                    wrap.className = 'img-card cursor-pointer transition-all duration-200 rounded-lg overflow-hidden relative aspect-square bg-gray-900 border-2 border-transparent hover:border-gray-500';
                    const fullPath = url; // It's already the local path
                    
                    // Match against saved selection (handling both full URL and local path if format changed)
                    const isSelected = selection[dish] && (selection[dish] === fullPath || selection[dish].endsWith(path.basename(fullPath)));
                    
                    if (isSelected) {
                        wrap.classList.add('selected');
                        wrap.classList.remove('border-transparent');
                        // Update selection to match stable local path if it was old format
                        if (selection[dish] !== fullPath) selection[dish] = fullPath;
                    }
                    
                    wrap.onclick = () => selectImage(dish, fullPath, wrap);

                    const img = document.createElement('img');
                    img.src = fullPath;
                    img.className = 'w-full h-full object-cover';
                    img.loading = 'lazy'; 
                    
                    wrap.appendChild(img);
                    imgRow.appendChild(wrap);
                });

                section.appendChild(imgRow);
                grid.appendChild(section);
            });

            updateUI(batchIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateUI(batchIndex) {
            // Progress
            document.getElementById('batch-indicator').textContent = `Batch ${batchIndex + 1} of ${totalBatches}`;
            const percent = Math.round(((batchIndex + 1) / totalBatches) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-percent').textContent = `${percent}% Completed`;

            // Buttons
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const exportBtn = document.getElementById('export-btn');

            prevBtn.disabled = batchIndex === 0;
            prevBtn.classList.toggle('opacity-50', batchIndex === 0);

            if (batchIndex === totalBatches - 1) {
                nextBtn.classList.add('hidden');
                exportBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                exportBtn.classList.add('hidden');
            }
            
            updateStatus();
        }

        function selectImage(dish, url, el) {
            const parent = el.parentElement;
            // Clear siblings
            Array.from(parent.children).forEach(c => {
                c.classList.remove('selected');
                c.classList.add('border-transparent');
            });
            
            if (selection[dish] === url) {
                delete selection[dish]; // Toggle off
            } else {
                selection[dish] = url;
                el.classList.add('selected');
                el.classList.remove('border-transparent');
            }
            
            // Save state
            localStorage.setItem('menu_image_selection', JSON.stringify(selection));
            updateStatus();
        }

        function updateStatus() {
            const count = Object.keys(selection).length;
            document.getElementById('status').textContent = `${count} selected`;
        }

        function nextBatch() {
            if (currentBatch < totalBatches - 1) {
                currentBatch++;
                renderBatch(currentBatch);
            }
        }

        function prevBatch() {
            if (currentBatch > 0) {
                currentBatch--;
                renderBatch(currentBatch);
            }
        }

        function exportSelection() {
            const out = document.getElementById('output');
            const area = document.getElementById('export-area');
            
            out.value = JSON.stringify(selection, null, 2);
            area.classList.remove('hidden');
            out.select();
            
            // Scroll to bottom
            const scrollingElement = (document.scrollingElement || document.body);
            scrollingElement.scrollTop = scrollingElement.scrollHeight;
        }

        // Start
        renderBatch(0);
    </script>
